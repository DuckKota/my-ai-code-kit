# My AI Code Kit manifest — single source of truth.
# Every command, skill, instruction, plugin, theme, and MCP server is declared
# here. `oc.py` installs / syncs / updates / uninstalls from this file.
#
# provenance:
#   original — mine, no upstream; `setup vendor` skips it
#   vendor   — stolen pristine; `setup vendor` overwrites from upstream
#   fork     — stolen + customized; `setup vendor` 3-way-merges upstream changes
#
# operation:
#   symlink       — file/dir artifact symlinked into the config dir
#   config-merge  — config entry merged into a JSON file (opencode.json, tui.json)
#   text-insert   — text block inserted into a target file (prepend/append)

version = 2

[config]
# Optional: override the opencode config dir. If unset, resolved via
# `opencode debug paths`. `OC_CONFIG_DIR` env var takes precedence.
# default_config_dir = "~/.config/opencode"

# ----------------------------------------------------------------- commands
[[artifacts]]
name = "commit-message"
agents = ["opencode", "omp"]
operation = "symlink"
type = "command"
provenance = "original"

[[artifacts.entries]]
src = "src/commands/commit-message.md"
target = "commands/commit-message.md"
# The installed command file must reference the installed validator script's
# absolute path; the placeholder is substituted at install time.
replace = { "<VALIDATE_COMMIT_SCRIPT>" = "{config_dir}/scripts/verify-commit" }

[[artifacts.entries]]
src = "src/commands/verify-commit"
target = "scripts/verify-commit"

